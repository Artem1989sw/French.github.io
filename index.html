<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Французька — лексика та граматика</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FAF6EF">
<style>
html, body{ height:100%; margin:0; }
body{ background:#FAF6EF; }
body:has(.fq-root[data-theme="dark"]){ background:#141A24; }
:root{ --ink:#1F2A38; --paper:#FAF6EF; --card:#FFFFFF; --card-alt:#F2EEE4; --line:#DCD3C0; --navy:#2E4057; --navy-solid:#2E4057; --gold:#B08D2B; --good:#3F7A54; --good-bg:#EEF6F0; --bad:#B0413E; --bad-bg:#FBEEED; --muted:#6B6459; }
*{box-sizing:border-box;}
.fq-root{ font-family: "Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif; color:var(--ink); background:var(--paper); padding:64px 18px 60px; border-radius:2px; max-width:720px; min-height:100vh; margin:0 auto; position:relative; transition:background-color .2s ease, color .2s ease; }
.fq-root[data-theme="dark"]{ --ink:#E7E1D3; --paper:#141A24; --card:#1E2734; --card-alt:#242F3E; --line:#2C3849; --navy:#6C93C4; --navy-solid:#3E6690; --gold:#E3C567; --good:#5FBE82; --good-bg:#1D3327; --bad:#E2827E; --bad-bg:#3A2323; --muted:#93A1B5; }
.fq-theme-toggle{ position:absolute; top:16px; right:18px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; line-height:1; z-index:5; }
.fq-theme-toggle:hover{ border-color:var(--gold); }
/* ---- left drawer: task type selector ---- */
.fq-drawer-toggle{ position:absolute; top:16px; left:18px; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; line-height:1; z-index:6; }
.fq-drawer-toggle:hover{ border-color:var(--gold); }
.fq-drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:9; }
.fq-drawer-panel{ position:fixed; top:0; left:0; height:100%; width:260px; max-width:82vw; background:var(--card); border-right:1px solid var(--line); z-index:10; padding:64px 20px 24px; box-shadow:4px 0 20px rgba(0,0,0,.25); font-family:"Helvetica Neue",Arial,sans-serif; overflow-y:auto; }
.fq-drawer-close{ position:absolute; top:16px; right:16px; width:28px; height:28px; border-radius:50%; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; padding:0; }
.fq-drawer-title{ font-size:12.5px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; margin-bottom:14px; }
.fq-drawer-title-spaced{ margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
.fq-drawer-item{ display:block; width:100%; text-align:left; background:none; border:1px solid var(--line); color:var(--ink); padding:12px 14px; margin-bottom:10px; font-size:14.5px; cursor:pointer; box-sizing:border-box; font-family:inherit; }
.fq-drawer-item.active{ border-color:var(--navy-solid); background:var(--navy-solid); color:#fff; font-weight:600; }
.fq-drawer-item-disabled{ cursor:default; opacity:.55; }
.fq-drawer-item-title{ display:block; }
.fq-drawer-item-count{ display:block; font-size:11.5px; color:var(--gold); font-weight:600; white-space:normal; overflow-wrap:break-word; margin-top:4px; line-height:1.4; }
.fq-drawer-item.active .fq-drawer-item-count{ color:#fff; }
.fq-drawer-note{ font-size:12.5px; color:var(--muted); margin-top:18px; line-height:1.5; }
.fq-voice-gender-row{ display:flex; gap:8px; margin-bottom:14px; }
.fq-voice-gender-btn{ flex:1; text-align:center; background:none; border:1px solid var(--line); color:var(--ink); padding:10px 8px; font-size:13.5px; cursor:pointer; font-family:inherit; }
.fq-voice-gender-btn.active{ border-color:var(--navy-solid); background:var(--navy-solid); color:#fff; font-weight:600; }
.fq-voice-rate-row{ margin-bottom:14px; }
.fq-voice-rate-label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
.fq-voice-rate-slider{ width:100%; }
/* ---- audio mode ---- */
.fq-audio-box{ display:flex; justify-content:center; align-items:center; margin:14px 0 30px; }
.fq-audio-play{ width:96px; height:96px; border-radius:50%; border:2px solid var(--navy); background:var(--card); color:var(--navy); font-size:38px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.fq-audio-play:hover{ background:var(--navy-solid); color:#fff; }
.fq-audio-play:active{ transform:scale(.96); }
.fq-audio-play-listening{ border-color:var(--bad); color:var(--bad); animation:fq-pulse 1s infinite; }
@keyframes fq-pulse{ 0%{ box-shadow:0 0 0 0 rgba(176,65,62,.4);} 70%{ box-shadow:0 0 0 14px rgba(176,65,62,0);} 100%{ box-shadow:0 0 0 0 rgba(176,65,62,0);} }
.fq-hint-correct{ color:var(--good); font-weight:600; }
.fq-hint-reveal{ font-weight:600; color:var(--ink); margin-bottom:8px !important; }
.fq-kicker{ font-family: "Helvetica Neue",Arial,sans-serif; font-size:12.5px; letter-spacing:.04em; color:var(--muted); margin:0 0 4px; }
.fq-title{ font-size:28px; font-weight:600; margin:0 0 22px; color:var(--navy); border-bottom:1px solid var(--line); padding-bottom:16px; }
/* ---- category picker ---- */
.fq-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:480px){ .fq-grid{grid-template-columns:1fr;} }
.fq-tile{ font-family:"Helvetica Neue",Arial,sans-serif; text-align:left; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--navy); padding:14px 16px; cursor:pointer; transition:transform .12s ease, border-color .12s ease; }
.fq-tile:hover{ border-left-color:var(--gold); transform:translateX(2px); }
.fq-tile-name{ font-size:16px; font-weight:600; color:var(--navy); margin-bottom:3px; }
.fq-tile-count{ font-size:12.5px; color:var(--muted); }
.fq-tile-progress{ font-size:11.5px; color:var(--gold); margin-top:6px; }
.fq-tile-toprow{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.fq-tile-toprow .fq-tile-name{ margin-bottom:3px; }
.fq-level-badge{ flex:0 0 auto; font-family:"Helvetica Neue",Arial,sans-serif; font-size:10px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:2px; color:#fff; white-space:nowrap; margin-top:1px; }
.fq-level-badge.lvl-a1{ background:var(--good); }
.fq-level-badge.lvl-a2{ background:var(--gold); }
.fq-level-badge.lvl-b1{ background:var(--navy-solid); }
.fq-level-badge.lvl-b2{ background:var(--bad); }
.fq-tile-highlight{ border-left-color:var(--gold); }
.fq-tile-disabled{ cursor:default; opacity:.6; }
.fq-tile-disabled:hover{ border-left-color:var(--gold); transform:none; }
/* ---- direction toggle (practice only) / level toggle (theory) ---- */
.fq-dirtoggle{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.fq-dirbtn{ flex:1 1 80px; text-align:center; padding:11px 14px; font-size:13.5px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; }
.fq-dirbtn.active{ border-color:var(--navy-solid); background:var(--navy-solid); color:#fff; font-weight:600; }
/* ---- quiz view ---- */
.fq-topbar{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:10px; }
.fq-topbar-right{ display:flex; align-items:center; gap:8px; }
.fq-star{ background:none; border:none; cursor:pointer; padding:0; line-height:1; font-size:19px; color:var(--muted); }
.fq-star.active{ color:var(--gold); }
.fq-back{ background:none;border:none;color:var(--navy); cursor:pointer; font-size:13px; padding:0; font-family:inherit; text-decoration:underline;}
.fq-progressbar{ height:3px; background:var(--line); margin-bottom:26px; position:relative;}
.fq-progressbar-fill{ height:3px; background:var(--gold); transition:width .25s ease;}
.fq-prompt-label{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:12.5px; color:var(--muted); margin-bottom:8px;}
.fq-prompt{ font-size:34px; line-height:1.25; margin:0 0 28px; color:var(--ink); }
.fq-options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
@media (max-width:480px){ .fq-options{grid-template-columns:1fr;} }
.fq-opt{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:16px; text-align:left; background:var(--card); border:1px solid var(--line); padding:13px 14px; cursor:pointer; color:var(--ink); }
.fq-opt:hover{ border-color:var(--navy); }
.fq-opt.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); font-weight:600;}
.fq-opt.wrong{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); font-weight:600;}

/* ---- sentence builder ---- */
.fq-sb-answer{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  min-height:52px; padding:10px; margin-bottom:16px;
  border:1px dashed var(--line); background:var(--card);
}
.fq-sb-answer.correct{ border:1px solid var(--good); border-style:solid; background:var(--good-bg); }
.fq-sb-answer.wrong{ border:1px solid var(--bad); border-style:solid; background:var(--bad-bg); }
.fq-sb-placeholder{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13.5px; color:var(--muted); }
.fq-sb-bank{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
.fq-sb-chip{
  font-family:"Helvetica Neue",Arial,sans-serif; font-size:15px;
  background:var(--card-alt); border:1px solid var(--line); color:var(--ink);
  padding:9px 14px; cursor:pointer; border-radius:2px;
}
.fq-sb-chip:hover:not(:disabled){ border-color:var(--gold); }
.fq-sb-chip.placed{ background:var(--navy-solid); border-color:var(--navy-solid); color:#fff; }
.fq-sb-chip:disabled{ cursor:default; opacity:.85; }
.fq-opt:disabled{ cursor:default; }
.fq-hint{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; color:var(--muted); min-height:20px; }
.fq-hint p{ margin:0 0 4px; }
.fq-hint i{ color:var(--gold); font-style:normal; }
.fq-hint-wrong i{ color:var(--bad); font-style:normal; }
.fq-hint-wrong{ color:var(--muted); }
.fq-antonym{ margin-top:8px !important; padding:6px 10px; border-left:3px solid var(--gold); background:var(--card-alt); color:var(--ink); font-size:13px; }
.fq-antonym b{ color:var(--navy); }
.fq-dict-antonym{ color:var(--muted); font-size:12.5px; }
.fq-speak{ font-family:"Helvetica Neue",Arial,sans-serif; display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--navy); color:var(--navy); padding:8px 14px; font-size:13.5px; cursor:pointer; margin-top:6px; }
.fq-reading-btnrow{ display:flex; flex-wrap:wrap; gap:10px; }
.fq-reading-btnrow .fq-speak{ margin-top:0; }
.fq-translate-btn{ border-color:var(--gold); color:var(--ink); }
.fq-reading-ua{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:14.5px; color:var(--muted); font-style:italic; line-height:1.6; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
.fq-speak:hover{ background:var(--navy-solid); color:#fff; }
.fq-speak:active{ opacity:.8; }
.fq-nextbar{ display:flex; justify-content:flex-end; margin-top:16px;}
.fq-next{ font-family:"Helvetica Neue",Arial,sans-serif; background:var(--navy-solid); color:#fff; border:none; padding:11px 22px; font-size:14px; cursor:pointer; }
.fq-next:disabled{ opacity:.35; cursor:default; }
/* ---- summary ---- */
.fq-summary-score{ font-size:44px; color:var(--navy); margin:6px 0 4px; }
.fq-summary-sub{ font-family:"Helvetica Neue",Arial,sans-serif; color:var(--muted); font-size:14px; margin-bottom:22px;}
.fq-missed-title{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; color:var(--muted); margin:22px 0 10px; text-transform:none;}
.fq-missed-item{ font-family:"Helvetica Neue",Arial,sans-serif; display:flex; justify-content:space-between; font-size:14.5px; padding:9px 0; border-bottom:1px solid var(--line); }
.fq-missed-fr{ color:var(--bad); font-weight:600; }
.fq-missed-ua{ color:var(--muted); }
.fq-preview-list{ margin-bottom:20px; font-family:"Helvetica Neue",Arial,sans-serif; }
.fq-preview-item{ display:flex; align-items:baseline; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line); font-size:14.5px; flex-wrap:wrap; }
.fq-preview-item.alt{ background:var(--card-alt); }
.fq-preview-fr{ font-weight:600; color:var(--ink); min-width:110px; }
.fq-preview-pron{ font-style:italic; color:var(--gold); font-size:12.5px; min-width:60px; }
.fq-preview-ua{ color:var(--muted); flex:1; }
.fq-btnrow{ display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
.fq-btn-secondary{ font-family:"Helvetica Neue",Arial,sans-serif; background:none; border:1px solid var(--navy); color:var(--navy); padding:10px 18px; font-size:14px; cursor:pointer; }
.fq-btn-primary{ font-family:"Helvetica Neue",Arial,sans-serif; background:var(--navy-solid); color:#fff; border:none; padding:10px 18px; font-size:14px; cursor:pointer; }
/* ---- tabs ---- */
.fq-tabs{ display:flex; gap:4px; margin-bottom:22px; font-family:"Helvetica Neue",Arial,sans-serif;}
.fq-tab{ background:none; border:none; border-bottom:2px solid transparent; font-size:14px; padding:8px 4px; margin-right:18px; cursor:pointer; color:var(--muted); }
.fq-tab.active{ color:var(--navy); border-bottom-color:var(--gold); font-weight:600; }
/* ---- theory ---- */
.fq-theory-article{ font-family:"Helvetica Neue",Arial,sans-serif; }
.fq-theory-article h3{ font-family:inherit; font-size:17px; color:var(--navy); margin:26px 0 10px; }
.fq-theory-article h3:first-child{ margin-top:0; }
.fq-theory-article p{ font-size:15px; line-height:1.55; margin:0 0 12px; }
.fq-theory-article ul{ margin:0 0 14px; padding-left:20px; }
.fq-theory-article li{ font-size:15px; line-height:1.55; margin-bottom:6px; }
.fq-ex{ background:var(--card); border-left:3px solid var(--gold); padding:9px 14px; margin:0 0 10px; font-size:14.5px;}
.fq-ex b{ color:var(--navy); }
.fq-ex span{ display:block; color:var(--muted); font-size:13px; margin-top:2px; }
/* ---- mini-practice block (after theory article) ---- */
.fq-mp-wrap{ margin-top:34px; }
.fq-mp-divider{ border-top:1px solid var(--line); margin:0 0 22px; }
.fq-mp-heading{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:19px; font-weight:600; color:var(--navy); margin:0 0 14px; }
.fq-mp-progress{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:12.5px; color:var(--muted); margin:0 0 8px; }
.fq-mp-sentence{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:17px; line-height:1.5; color:var(--ink); margin:0 0 16px; }
.fq-mp-note{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; color:var(--muted); margin:10px 0 0; line-height:1.5; }
.fq-mp-note i{ color:var(--gold); font-style:normal; }
.fq-mp-done{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:16px; color:var(--ink); margin:0 0 16px; }
.fq-mp-done b{ color:var(--navy); }
.fq-theory-table{ width:100%; border-collapse:collapse; margin:0 0 18px; font-size:14px; }
.fq-theory-table th{ background:var(--navy-solid); color:#fff; text-align:left; padding:8px 10px; font-weight:600; }
.fq-theory-table td{ padding:8px 10px; border-bottom:1px solid var(--line); }
.fq-theory-table tr:nth-child(even) td{ background:var(--card-alt); }
/* ---- dictionary ---- */
.fq-search{ font-family:"Helvetica Neue",Arial,sans-serif; width:100%; box-sizing:border-box; padding:11px 14px; font-size:14.5px; border:1px solid var(--line); background:var(--card); color:var(--ink); margin-bottom:16px; }
.fq-search:focus{ outline:none; border-color:var(--navy); }
.fq-dict-table{ width:100%; border-collapse:collapse; font-family:"Helvetica Neue",Arial,sans-serif; font-size:14.5px; }
.fq-dict-table th{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--navy); color:var(--navy); font-size:12.5px; letter-spacing:.02em;}
.fq-dict-table td{ padding:9px 10px; border-bottom:1px solid var(--line); }
.fq-dict-table tr.alt td{ background:var(--card-alt); }
.fq-dict-star-col{ width:34px; text-align:center; padding:9px 4px !important; }
.fq-dict-star-col .fq-star{ font-size:16px; }
.fq-core-badge{ margin-right:5px; font-size:11px; }
.fq-history-note{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; color:var(--muted); margin:14px 0 0; }
.fq-progress-subtitle{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:15px; font-weight:600; color:var(--navy); margin:34px 0 12px; }
.fq-stat-chips{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.fq-stat-chip{ flex:1 1 140px; font-family:"Helvetica Neue",Arial,sans-serif; background:var(--card); border:1px solid var(--line); border-top:3px solid var(--gold); padding:12px 14px; }
.fq-stat-chip-val{ font-size:20px; font-weight:700; color:var(--navy); }
.fq-stat-chip-label{ font-size:12px; color:var(--muted); margin-top:2px; }
/* ---- streak + calendar ---- */
.fq-streak-wrap{ font-family:"Helvetica Neue",Arial,sans-serif; background:var(--card); border:1px solid var(--line); padding:16px 18px 18px; margin-bottom:22px; }
.fq-streak-flamerow{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
.fq-streak-flame{ font-size:34px; opacity:.35; filter:grayscale(1); }
.fq-streak-flame.active{ opacity:1; filter:none; }
.fq-streak-count{ display:flex; flex-direction:column; }
.fq-streak-num{ font-size:26px; font-weight:700; color:var(--navy); line-height:1.1; }
.fq-streak-label{ font-size:12.5px; color:var(--muted); }
.fq-streak-best{ font-size:12.5px; color:var(--muted); margin-left:auto; }
.fq-cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.fq-cal-navbtn{ background:none; border:1px solid var(--line); color:var(--ink); width:26px; height:26px; cursor:pointer; font-size:14px; line-height:1; }
.fq-cal-navbtn:disabled{ opacity:.35; cursor:default; }
.fq-cal-monthlabel{ font-size:13.5px; font-weight:600; color:var(--navy); }
.fq-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.fq-cal-weekday{ text-align:center; font-size:10.5px; color:var(--muted); padding-bottom:4px; }
.fq-cal-cell{ position:relative; aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--paper); font-size:11px; color:var(--ink); }
.fq-cal-cell-empty{ border:none; background:none; }
.fq-cal-daynum{ line-height:1; }
.fq-cal-fire{ font-size:11px; line-height:1; margin-top:1px; }
.fq-cal-active{ border-color:var(--gold); background:var(--good-bg); }
.fq-cal-today{ border-color:var(--navy-solid); border-width:2px; font-weight:700; }
.fq-cal-future{ opacity:.4; }
/* ---- accuracy chart ---- */
.fq-chart-wrap{ margin-bottom:22px; }
.fq-chart-svg{ width:100%; height:auto; display:block; }
.fq-chart-grid{ stroke:var(--line); stroke-width:1; }
.fq-chart-axislabel{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:9px; fill:var(--muted); }
.fq-chart-xlabel{ font-family:"Helvetica Neue",Arial,sans-serif; font-size:9px; fill:var(--muted); }
.fq-chart-line{ fill:none; stroke:var(--navy-solid); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
.fq-chart-area{ fill:var(--navy-solid); opacity:.08; stroke:none; }
.fq-chart-dot{ fill:var(--gold); stroke:var(--card); stroke-width:1.5; }
/* ---- achievements / badges ---- */
.fq-badges-wrap{ margin-bottom:22px; }
.fq-badges-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:10px; }
.fq-badge{ font-family:"Helvetica Neue",Arial,sans-serif; text-align:center; border:1px solid var(--line); background:var(--card); padding:12px 6px 10px; }
.fq-badge-unlocked{ border-color:var(--gold); background:var(--card-alt); }
.fq-badge-locked{ opacity:.5; }
.fq-badge-icon{ font-size:26px; margin-bottom:5px; line-height:1; }

<script>
/* [рівень, речення, [правильне, хибні…], переклад речення, пояснення, значення слова, [інші допустимі відповіді]] */
const RAW = [
/* ---------- A1 ---------- */
['A1','Je vais ___ le boulanger pour acheter du pain.',['chez','à','dans','en'],'Я йду до пекаря купити хліба.','Перед назвою людини чи професії («до когось») вживаємо chez: chez le boulanger, chez moi, chez le médecin.','chez — у, до (когось); у когось вдома','P'],
['A1','Tu as ___ frère ou une sœur ?',['un','une','le','des'],'У тебе є брат чи сестра?','Frère — чоловічого роду, тому un frère. Une — для жіночого роду (une sœur).','un — один; невизначений артикль чоловічого роду','X'],
['A1','Elle boit ___ eau.',['de l’','du','de la','des'],'Вона п’є воду.','Частковий артикль перед голосною скорочується: de l’eau (хоча eau — жіночого роду).','de l’ — частковий артикль («трохи») перед голосною','X'],
['A1','J’___ faim.',['ai','suis','fais','veux'],'Я голодний.','Голод, спрагу, страх виражають через avoir: avoir faim, avoir soif, avoir peur.','ai — маю (avoir); j’ai faim — я голодний','V'],
['A1','Dimanche, nous ___ une promenade au parc.',['faisons','allons','prenons','jouons'],'У неділю ми гуляємо в парку.','Стале словосполучення: faire une promenade. Прогулянку «роблять», а не «беруть».','faisons — робимо (faire); faire une promenade — гуляти','V'],
['A1','Il est huit heures : je prends mon ___.',['petit-déjeuner','déjeuner','dîner','goûter'],'Восьма година: я снідаю.','Petit-déjeuner — сніданок; déjeuner — обід; dîner — вечеря; goûter — полуденок.','petit-déjeuner — сніданок','N'],
['A1','Il pleut : n’oublie pas ton ___ !',['parapluie','maillot de bain','short','ventilateur'],'Іде дощ: не забудь парасольку!','Il pleut — іде дощ, тож потрібен parapluie.','parapluie — парасолька',['imperméable'],'N'],
['A1','Mon père ___ dans une banque.',['travaille','joue','fait','regarde'],'Мій тато працює в банку.','travailler dans / à + місце роботи.','travaille — працює (travailler)','V'],

Object.assign(TR,{fais:'роблю, робиш; роби',prends:'беру, береш; бери',mets:'кладу, кладеш; клади',dis:'кажу, кажеш; кажи',lis:'читаю, читаєш; читай',vois:'бачу, бачиш',viens:'приходжу, приходиш; приходь',sors:'виходжу, виходиш; виходь',pars:'від’їжджаю; їдь',écris:'пишу, пишеш; пиши',attends:'чекаю, чекаєш; чекай',bois:'п’ю, п’єш; пий',dors:'сплю, спиш; спи',finis:'закінчую; закінчуй',perds:'втрачаю; втрачай',vends:'продаю; продавай',sers:'подаю; подавай',ouvres:'відчиняєш; відчиняй',parles:'говориш; говори'});
const lemma=q=>q.m.split('—')[0].trim();
const gloss=q=>(q.m.split('—')[1]||'').trim();
const mx=q=>{const a=q.m.replace(/[.\s]+$/,''),b=q.e.replace(/[.\s]+$/,'');return b.startsWith(a)?{w:q.e,e:''}:{w:q.m,e:q.e};};
const QS=new Map(Q.map(q=>[q.s,q]));
const BADPH=/^(de l’|sommes allés|te lèves|il y a une|moins le quart|et quart|midi et demi)$/;
const okTxt=q=>{const l=lemma(q),g=gloss(q);return /^[a-zàâäçéèêëîïôöûùüÿœæ’\- …]+$/i.test(l)&&!/[A-Za-z]/.test(g)&&g.length>1&&g.length<=40&&!/[+/]/.test(l);};
const REVQ=Q.filter(q=>okTxt(q)&&!/\s/.test(lemma(q))&&'NVAD'.includes(q.pos));
const PHQ=(()=>{const seen=new Set();return Q.filter(q=>{const l=lemma(q);if(!okTxt(q)||!/\s/.test(l)||BADPH.test(l)||seen.has(l))return false;seen.add(l);return true;});})();
const PHSET=new Set(PHQ.map(q=>q.s));
const gk=g=>g.toLowerCase().split(/[\s,;]+/)[0].slice(0,5);
function mkRev(q){
  const ph=PHSET.has(q.s), L=lemma(q), G=gloss(q);
  let cand=(ph?PHQ:REVQ.filter(x=>x.pos===q.pos)).filter(x=>lemma(x)!==L&&gk(gloss(x))!==gk(G));
  const seen=new Set([L]), ds=[];
  for(const x of shuffle(cand.slice())){const l=lemma(x);if(seen.has(l))continue;seen.add(l);ds.push({w:l,g:gloss(x)});if(ds.length===3)break;}
  return {rev:true,base:q,s:q.s,l:q.l,pos:q.pos,ph,lem:L,g:G,ro:[{w:L,g:G},...ds]};
}
const EK='lemotjuste.errs';
function loadErrs(){try{return JSON.parse(localStorage.getItem(EK)||'{}');}catch(e){return {};}}
function saveErrs(o){try{localStorage.setItem(EK,JSON.stringify(o));}catch(e){}}
function record(key,ok){const E=loadErrs();if(ok){if(E[key]){E[key].s=(E[key].s||0)+1;if(E[key].s>=2)delete E[key];}}else{E[key]={n:((E[key]&&E[key].n)||0)+1,s:0};}saveErrs(E);}
function errCount(){return Object.keys(loadErrs()).length;}
function poolFor(){
  const lv=q=>S.level==='all'||q.l===S.level;
  if(S.mode==='rev') return REVQ.filter(q=>lv(q)&&(S.pos==='all'||q.pos===S.pos));
  if(S.mode==='phr') return PHQ.filter(lv);
  return Q.filter(q=>lv(q)&&(S.pos==='all'||q.pos===S.pos));
}
const POSES=[['all','Усі'],['N','Іменники'],['V','Дієслова'],['A','Прикметники'],['D','Прислівники'],['P','Прийменники й сполучники'],['X','Займенники й артиклі'],['I','Вирази']];
const POSNAME={N:'іменник',V:'дієслово',A:'прикметник',D:'прислівник',P:'прийменник / сполучник',X:'займенник / артикль',I:'вираз'};

const LEVELS = [['all','Усі рівні'],['A1','A1'],['A2','A2'],['B1','B1']];
const R = {level:'all', pos:'all', hide:false, sort:'level', q:'', n:40};

const ACCENTS = ['é','è','ê','à','â','ç','ù','û','î','ï','ô','œ','’'];

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cnt(l,p){return Q.filter(q=>(l==='all'||q.l===l)&&(p==='all'||q.pos===p)).length;}
function norm(s){return s.trim().toLowerCase().replace(/['`´]/g,'’').replace(/\s+/g,' ').replace(/[.!?,;:]+$/,'');}
function strip(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/æ/g,'ae');}
function bestKey(){return S.mode+':'+S.level+':'+S.pos+':'+S.len;}
function loadBest(){try{return JSON.parse(localStorage.getItem('lemotjuste.best')||'{}');}catch(e){return {};}}
function saveBest(key,pct){try{const b=loadBest();if(!(b[key]>=pct)){b[key]=pct;localStorage.setItem('lemotjuste.best',JSON.stringify(b));}}catch(e){}}

function sentence(q,mode,word){
  const [b,a0]=q.s.split('___'); const right=q.o[0];
  const join=(w,rest)=>/['’]$/.test(w)?rest.replace(/^\s/,''):rest;
  if(mode==='blank') return esc(b)+'<span class="blank" role="img" aria-label="пропуск"></span>'+esc(a0);
  if(mode==='ok'){const w=word||right;return esc(b)+`<span class="fill ok">${esc(w)}</span>`+esc(join(w,a0));}
  return esc(b)+`<span class="fill bad">${esc(word)}</span> <span class="fill ok">${esc(right)}</span>`+esc(join(right,a0));
}

const MODES=[['choice','Обрати з варіантів'],['type','Вписати слово'],['rev','Слово за перекладом'],['phr','Вирази']];
const lvlName=k=>(LEVELS.find(x=>x[0]===k)||[])[1]||k;
const posName=k=>(POSES.find(x=>x[0]===k)||[])[1]||k;

      <div class="row" style="margin-top:0">
        <button class="btn" data-act="start" ${total===0?'disabled':''}>Почати${total?` · ${Math.min(S.len,total)}`:''}</button>

        <button class="btn ghost" data-act="menu">Налаштування</button>
      </div>
    </div>
  </div>`;
}

function begin(pool){
  S.pool=pool; S.i=0; S.score=0; S.wrong=[]; S.locked=false; S.hints=0;
  renderQ();
}
function start(){
  S.src='';
  const rv=S.mode==='rev'||S.mode==='phr';
  begin(shuffle(poolFor().slice()).slice(0,S.len).map(q=>rv?mkRev(q):q));
}
function startErrs(){
  const E=loadErrs();
  const keys=shuffle(Object.keys(E)).sort((a,b)=>E[b].n-E[a].n).slice(0,S.len);
  const items=keys.map(k=>{const r=k.startsWith('r:'),q=QS.get(r?k.slice(2):k);return q?(r?mkRev(q):q):null;}).filter(Boolean);
  if(!items.length) return;
  S.src='errs'; begin(shuffle(items));
}
function retryWrong(){ begin(shuffle(S.wrong.map(w=>w.q))); }

function renderQ(){
  const q=S.pool[S.i], n=S.pool.length;
  S.locked=false; S.screen='q';
  if(q.rev){renderRev(q);return;}
  let input;

  <div class="top"><span>Питання ${S.i+1} з ${n} · ${q.l}</span><span class="r"><span>Правильно: <span id="sc">${S.score}</span></span><button class="tog" data-act="tr" aria-pressed="${S.showTr}">Переклад: ${S.showTr?'так':'ні'}</button></span></div>

function renderRev(q){
  const n=S.pool.length;
  S.opts=shuffle(q.ro.map((x,k)=>({w:x.w,g:x.g,ok:k===0})));
  app.innerHTML=`
  <div class="top"><span>Питання ${S.i+1} з ${n} · ${q.l} · ${q.ph?'вираз':'слово'}</span><span class="r"><span>Правильно: <span id="sc">${S.score}</span></span></span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><i style="width:${S.i/n*100}%"></i></div>
  <div class="sheet"><p class="sent-tr" style="padding-bottom:4px">Як це сказати по-французьки?</p><p class="sentence" id="sent">«${esc(q.g)}»</p><p class="sent-tr">${POSNAME[q.pos]||''}</p></div>
  <div class="opts notr" role="group" aria-label="Варіанти відповіді">
    ${S.opts.map((o,k)=>`<button class="opt" data-act="pick" data-k="${k}"><kbd>${k+1}</kbd><span class="ow">${esc(o.w)}<span class="otr">${esc(o.g)}</span></span></button>`).join('')}
  </div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="row" id="nextrow" hidden><button class="btn" id="next" data-act="next">${S.i+1<n?'Далі':'Результат'}</button></div>`;

function pickRev(k){
  const q=S.pool[S.i], o=S.opts[k];
  document.querySelector('.opts').classList.add('done');
  document.querySelectorAll('.opt').forEach((b,idx)=>{b.disabled=true;if(S.opts[idx].ok)b.classList.add('correct');else if(idx===k)b.classList.add('wrong');else b.classList.add('dim');});
  S.locked=true;
  if(o.ok) S.score++; else S.wrong.push({q,chosen:o.w,cg:o.g});
  record('r:'+q.s,o.ok);
  document.getElementById('sc').textContent=S.score;
  const b=q.base;
  document.getElementById('fb').innerHTML=`<div class="card ${o.ok?'ok':'bad'}">
    <p class="verdict">${o.ok?'Правильно.':'Не зовсім. Правильно: '+esc(q.lem)+'.'}</p>
    ${o.ok?'':`<p class="why">Ти обрав: <b>${esc(o.w)}</b> — ${esc(o.g)}.</p>`}
    <p class="word"><b>${esc(q.lem)} — ${esc(q.g)}</b> <span class="poslab">${POSNAME[q.pos]||''}</span></p>
    <p class="ex">Приклад: ${sentence(b,'ok')}</p><p class="tr">${esc(b.t)}</p></div>`;
  document.getElementById('nextrow').hidden=false; document.getElementById('next').focus();
}

function feedback(q,kind,note,shown){
  const right=q.o[0];
  const verdict = kind==='ok' ? (note||'Правильно.') : 'Не зовсім. Правильна відповідь: '+right;
  const tw=trw(shown||''), tr0=trw(right)||gloss(q);
  const why = (kind==='bad'&&shown&&tw) ? `<p class="why">Ти обрав: <b>${esc(shown)}</b> — ${esc(tw)}. Тут потрібне: <b>${esc(right)}</b> — ${esc(tr0)}.</p>` : '';
  const extra = (kind==='bad' && S.mode==='type') ? `<button class="btn ghost small" data-act="accept">Моя відповідь теж підходить — зарахувати</button>` : '';
  document.getElementById('fb').innerHTML=`<div class="card ${kind}">
    <p class="verdict">${esc(verdict)}</p>
    ${why}<p class="word"><b>${esc(mx(q).w)}</b> <span class="poslab">${POSNAME[q.pos]||''}</span></p>
    ${S.showTr?'':`<p class="tr">${esc(q.t)}</p>`}<p class="ex"${mx(q).e?'':' hidden'}>${esc(mx(q).e)}</p>${extra}</div>`;
  document.getElementById('nextrow').hidden=false;
  document.getElementById('next').focus();
}

function finish(q,ok,shown,note){
  S.locked=true;
  if(ok) S.score++; else S.wrong.push({q,chosen:shown});
  document.getElementById('sc').textContent=S.score;
  document.getElementById('sent').innerHTML= ok ? sentence(q,'ok',shown) : sentence(q,'bad',shown);
  record(q.s,ok);
  feedback(q,ok?'ok':'bad',note,shown);
}

function pick(k){
  const q0=S.pool[S.i];
  if(S.locked||!q0||!(S.mode==='choice'||q0.rev)) return;
  if(q0.rev){pickRev(k);return;}
  const q=q0, o=S.opts[k];
  document.querySelector('.opts')?.classList.add('done');
  document.querySelectorAll('.opt').forEach((b,idx)=>{
    b.disabled=true;
    if(S.opts[idx].ok) b.classList.add('correct');
    else if(idx===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  finish(q,o.ok,o.w);
}

function check(){
  if(S.locked||S.mode!=='type') return;
  const inp=document.getElementById('ans'); const v=inp.value;
  if(!norm(v)){inp.focus();return;}
  const q=S.pool[S.i], t=norm(v), answers=[q.o[0],...q.alt];
  let hit=answers.find(a=>norm(a)===t), loose=false;
  if(!hit){hit=answers.find(a=>strip(norm(a))===strip(t)); loose=!!hit;}
  inp.disabled=true; document.getElementById('check').disabled=true;
  document.querySelectorAll('.acc,#hintbtn').forEach(b=>b.disabled=true);
  if(hit){
    let note=null;
    if(loose) note='Майже ідеально: пиши з діакритикою — '+hit+'.';
    else if(hit!==q.o[0]) note='Теж підходить. У тексті було слово: '+q.o[0]+'.';
    finish(q,true,hit,note);
  } else {
    finish(q,false,v.trim());
  }
}

function accept(){
  const q=S.pool[S.i]; const last=S.wrong[S.wrong.length-1];
  if(!last||last.q!==q) return;
  const mine=last.chosen;
  S.wrong.pop(); S.score++;
  {const E=loadErrs();if(E[q.s]){E[q.s].n--;if(E[q.s].n<=0)delete E[q.s];saveErrs(E);}}
  document.getElementById('sc').textContent=S.score;
  document.getElementById('sent').innerHTML=sentence(q,'ok',mine);
  const card=document.querySelector('#fb .card');
  card.className='card ok';
  card.querySelector('.verdict').textContent='Зараховано. У тексті було слово: '+q.o[0]+'.';
  card.querySelector('[data-act="accept"]')?.remove();
}

function hint(){
  if(S.locked) return;
  const q=S.pool[S.i], w=q.o[0], el=document.getElementById('hint');
  S.hints++;
  const letters=w.replace(/[^A-Za-zÀ-ÿœŒ]/g,'').length;
  el.hidden=false;
  el.textContent='Починається на «'+w.charAt(0)+'», літер: '+letters+'. Значення: '+q.m.split('—')[1].trim()+'.';
}

function next(){
  if(!S.locked) return;
  S.i++;
  if(S.i<S.pool.length) renderQ(); else renderResults();
  window.scrollTo({top:0});
}

function renderResults(){
  S.screen='res';
  const n=S.pool.length, pct=Math.round(S.score/n*100);
  if(S.src!=='errs') saveBest(bestKey(),pct);
  const msg = pct>=90?'Voilà — майже без помилок. Можна переходити на складніший рівень чи режим.'
    : pct>=70?'Добре. Помилки нижче — саме те, що варто повторити.'
    : pct>=40?'Непогано для початку. Перечитай пояснення до помилок і спробуй ще раз.'
    : 'Це нормально: такі слова легко плутати. Переглянь пояснення й пройди раунд повторно.';
  const hintsLine = (S.mode==='type'&&S.hints)?` Підказок використано: ${S.hints}.`:'';
  app.innerHTML=`
  <div class="sheet">
    <p class="score">${S.score} <small>з ${n}</small></p>
    <p class="rmsg">${msg}${hintsLine}</p>
    <div class="row">
      <button class="btn" data-act="start">Новий раунд</button>
      ${S.wrong.length?`<button class="btn ghost" data-act="retry">Повторити помилки (${S.wrong.length})</button>`:''}
      <button class="btn ghost" data-act="menu">Налаштування</button>
    </div>
  </div>
  ${S.wrong.length?`<div class="review"><h2>Над чим попрацювати (${S.wrong.length})</h2>
    ${S.wrong.map(w=>w.q.rev?`<div class="item"><p class="s">«${esc(w.q.g)}»</p><p class="word"><b>${esc(w.q.lem)}</b> <span class="poslab">${POSNAME[w.q.pos]||''}</span></p><p class="ex">Ти обрав: ${esc(w.chosen)} — ${esc(w.cg||'')}</p><p class="tr">${sentence(w.q.base,'ok')}</p></div>`:`<div class="item"><p class="s">${sentence(w.q,'bad',w.chosen)}</p><p class="tr">${esc(w.q.t)}</p><p class="word"><b>${esc(mx(w.q).w)}</b> <span class="poslab">${POSNAME[w.q.pos]||''}</span></p>${mx(w.q).e?`<p class="ex">${esc(mx(w.q).e)}</p>`:''}</div>`).join('')}
  </div>`:''}`;
}


/* ---------- Довідник ---------- */
function renderRef(){
  app.innerHTML=`
  <div class="sheet">
    <h1 class="title">Довідник</h1>
    <p class="lead">Усі речення з правильним словом на місці пропуску. Шукай за словом чи реченням — французькою або українською.</p>
    <div class="grp"><input class="search" id="rq" type="search" placeholder="Знайти слово або речення…" value="${esc(R.q)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Пошук">
      <p class="summary" style="margin-top:12px">${lvlName(R.level)} · ${posName(R.pos)}${R.hide?' · слова приховано':''}${R.sort==='abc'?' · за алфавітом':''}</p>
      <button class="btn ghost small" data-act="menu" style="margin-top:0">Фільтри</button>
    </div>
  </div>
  <p class="count" id="rcount" aria-live="polite"></p>
  <div id="rlist"></div>
  <div class="row" id="rmore"></div>`;
  fillRefList();
}

function fillRefList(){
  const qn=strip(R.q.trim().toLowerCase().replace(/['`´]/g,'’'));
  let list=Q.filter(q=>(R.level==='all'||q.l===R.level)&&(R.pos==='all'||q.pos===R.pos));
  if(qn){
    list=list.filter(q=>strip((q.s+' '+q.o[0]+' '+q.alt.join(' ')+' '+q.t+' '+q.m+' '+q.e).toLowerCase()).includes(qn));
  }
  if(R.sort==='abc') list=list.slice().sort((a,b)=>strip(a.o[0].toLowerCase()).localeCompare(strip(b.o[0].toLowerCase()),'fr'));
  document.getElementById('rcount').textContent='Знайдено: '+list.length+(list.length?'':'. Спробуй інше слово чи зніми фільтри.');
  const shown=list.slice(0,R.n);
  document.getElementById('rlist').innerHTML=shown.map(q=>`
    <article class="rc${R.hide?' hid':''}" data-act="rev">
      <p class="s"><span class="sa">${sentence(q,'ok')}</span><span class="sb">${sentence(q,'blank')}</span></p>
      <p class="tr">${esc(q.t)}</p>
      <p class="word rv"><b>${esc(q.m)}</b> <span class="poslab">${POSNAME[q.pos]||''} · ${q.l}</span></p>
      ${q.alt.length?`<p class="ex rv">Також підходить: ${esc(q.alt.join(', '))}</p>`:''}
      <p class="ex rv">${esc(q.e)}</p>
    </article>`).join('');
  document.getElementById('rmore').innerHTML = list.length>R.n ? `<button class="btn ghost" data-act="rmore">Показати ще (${list.length-R.n})</button>` : '';
}

function setView(v){
  if(v===S.view) return;
  if(S.view==='quiz') S.snap=app.innerHTML;
  S.view=v;
  document.getElementById('crumb').textContent=v==='ref'?'Довідник':'Тест';
  if(v==='ref') renderRef();
  else if(S.snap){app.innerHTML=S.snap;const a=document.getElementById('ans');if(a&&!a.disabled)a.focus({preventScroll:true});}
  else renderStart();
  window.scrollTo({top:0});
}

/* ---------- Меню (гамбургер) ---------- */
const drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim'), burger=document.getElementById('burger'), dbody=document.getElementById('dbody');
function drawerOpen(){return drawer.classList.contains('open');}
function chipsHtml(items,cur,act){return items.map(([k,n])=>`<button class="chip" data-d="${act}" data-v="${k}" aria-pressed="${cur===k}">${n}</button>`).join('');}
function posSelect(cur,act,lvl){return `<select class="sel" data-d="${act}" aria-label="Частина мови">${POSES.map(([k,n])=>`<option value="${k}"${cur===k?' selected':''}>${n} · ${cnt(lvl,k)}</option>`).join('')}</select>`;}

function renderDrawer(){
  const v=S.view; let h=`<div class="dsec"><h3>Розділи</h3><div class="dnav">
    <button class="dnavb" data-d="view" data-v="quiz" aria-current="${v==='quiz'}">Тест</button>
    <button class="dnavb" data-d="view" data-v="ref" aria-current="${v==='ref'}">Довідник</button></div></div>`;
  if(v==='quiz'){
    const total=poolFor().length, ec=errCount();
    h+=`<div class="dsec"><h3>Режим</h3><div class="chips">${chipsHtml(MODES,S.mode,'mode')}</div></div>
    <div class="dsec"><h3>Рівень</h3><div class="chips">${LEVELS.map(([k,n])=>`<button class="chip" data-d="level" data-v="${k}" aria-pressed="${S.level===k}">${n} · ${cnt(k,S.pos)}</button>`).join('')}</div></div>
    <div class="dsec"><h3>Частина мови</h3>${posSelect(S.pos,'pos',S.level)}</div>
    <div class="dsec"><h3>Питань у раунді</h3><div class="chips">${[10,20,40,80].map(n=>`<button class="chip" data-d="len" data-v="${n}" aria-pressed="${S.len===n}">${n}</button>`).join('')}</div></div>
    <div class="dsec"><button class="btn" data-d="start" ${total===0?'disabled':''} style="width:100%">Почати новий раунд${total?` · ${Math.min(S.len,total)}`:''}</button>
    ${ec?`<button class="btn ghost" data-d="errs" style="width:100%;margin-top:8px">Мої помилки · ${ec}</button>`:''}
    <p class="dnote">${total===0?'Для цього поєднання речень поки немає.':(S.screen==='q'?'Новий раунд замінить поточний.':'Налаштування застосовуються до наступного раунду.')}</p></div>`;
  } else {
    h+=`<div class="dsec"><h3>Рівень</h3><div class="chips">${LEVELS.map(([k,n])=>`<button class="chip" data-d="rl" data-v="${k}" aria-pressed="${R.level===k}">${n} · ${cnt(k,R.pos)}</button>`).join('')}</div></div>
    <div class="dsec"><h3>Частина мови</h3>${posSelect(R.pos,'rp',R.level)}</div>
    <div class="dsec"><h3>Показ</h3><div class="chips">
      <button class="chip" data-d="rhide" aria-pressed="${R.hide}">Приховати слова</button>
      <button class="chip" data-d="rsort" aria-pressed="${R.sort==='abc'}">За алфавітом</button></div>
    <p class="dnote">«Приховати слова» — самоперевірка: торкнись речення, щоб побачити слово.</p></div>`;
  }
  dbody.innerHTML=h;
}
function openDrawer(){
  renderDrawer();
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false'); scrim.hidden=false;
  burger.setAttribute('aria-expanded','true'); document.body.style.overflow='hidden';
  document.getElementById('dclose').focus();
}
function closeDrawer(){
  drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); scrim.hidden=true;
  burger.setAttribute('aria-expanded','false'); document.body.style.overflow='';
}
function quizSettingsChanged(){ if(S.view==='quiz'&&S.screen==='start') renderStart(); renderDrawer(); }
burger.addEventListener('click',()=>{drawerOpen()?closeDrawer():openDrawer();});
document.getElementById('dclose').addEventListener('click',()=>{closeDrawer();burger.focus();});
scrim.addEventListener('click',()=>{closeDrawer();});
dbody.addEventListener('click',e=>{
  const b=e.target.closest('[data-d]'); if(!b||b.tagName==='SELECT') return;
  const d=b.dataset.d, v=b.dataset.v;
  if(d==='view'){closeDrawer();setView(v);}
  else if(d==='mode'){S.mode=v;quizSettingsChanged();}
  else if(d==='level'){S.level=v;quizSettingsChanged();}
  else if(d==='len'){S.len=+v;quizSettingsChanged();}
  else if(d==='start'){closeDrawer();start();window.scrollTo({top:0});}
  else if(d==='errs'){closeDrawer();startErrs();window.scrollTo({top:0});}
  else if(d==='rl'){R.level=v;R.n=40;renderRef();renderDrawer();}
  else if(d==='rhide'){R.hide=!R.hide;renderRef();renderDrawer();}
  else if(d==='rsort'){R.sort=R.sort==='abc'?'level':'abc';R.n=40;renderRef();renderDrawer();}
});
dbody.addEventListener('change',e=>{
  const t=e.target; if(!t.matches('select[data-d]')) return;
  if(t.dataset.d==='pos'){S.pos=t.value;quizSettingsChanged();}
  else if(t.dataset.d==='rp'){R.pos=t.value;R.n=40;renderRef();renderDrawer();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerOpen()){closeDrawer();burger.focus();}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='rq'){R.q=e.target.value;R.n=40;fillRefList();}});

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='menu'){openDrawer();}
  else if(act==='rmore'){R.n+=40;fillRefList();}
  else if(act==='rev'){if(b.classList.contains('hid'))b.classList.toggle('rev');}
  else if(act==='start'){start();window.scrollTo({top:0});}
  else if(act==='retry'){retryWrong();window.scrollTo({top:0});}
  else if(act==='errs'){startErrs();window.scrollTo({top:0});}
  else if(act==='home'){renderStart();}
  else if(act==='pick'){pick(+b.dataset.k);}
  else if(act==='check'){check();}
  else if(act==='accept'){accept();}
  else if(act==='hint'){hint();}
  else if(act==='acc'){
    const inp=document.getElementById('ans'); if(!inp||inp.disabled) return;
    const c=b.dataset.c, s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s;
    inp.value=inp.value.slice(0,s)+c+inp.value.slice(en);
    inp.focus(); inp.setSelectionRange(s+c.length,s+c.length);
  }
  else if(act==='next'){next();}
  else if(act==='tr'){
    S.showTr=!S.showTr; b.setAttribute('aria-pressed',S.showTr); b.textContent='Переклад: '+(S.showTr?'так':'ні');
    document.querySelector('.opts')?.classList.toggle('notr',!S.showTr);
    const q=S.pool[S.i], sh=document.querySelector('.sheet'), ex=document.getElementById('srtr');
    if(S.showTr&&!ex){const p=document.createElement('p');p.className='sent-tr';p.id='srtr';p.textContent=q.t;sh.appendChild(p);}
    if(!S.showTr&&ex){ex.remove();}
    if(S.locked){
      document.querySelector('#fb .tr')?.remove();
      if(!S.showTr){document.querySelector('#fb .ex').insertAdjacentHTML('beforebegin','<p class="tr">'+esc(q.t)+'</p>');}
    }
  }
});
document.addEventListener('keydown',e=>{
  if(drawerOpen()||S.view!=='quiz'||!document.getElementById('sent')) return;
  if((S.mode==='choice'||(S.pool[S.i]&&S.pool[S.i].rev)) && !S.locked && /^[1-4]$/.test(e.key)){const k=+e.key-1;if(S.opts[k])pick(k);}
  if(S.mode==='type' && e.key==='Enter' && e.target&&e.target.id==='ans'){e.preventDefault();check();}
});

renderStart();
</scr__ipt>
</body>
</html>
</script>

  // Strips a masculine/feminine marker down to a plain masculine-singular base, so an
  // adjective like "content(e)" or "sérieux / sérieuse" becomes a safe drop-in for a
  // template sentence ("content", "sérieux").
  function adjBaseForm(raw){
    let w = raw.split(" / ")[0].trim();
    w = w.replace(/\([^)]*\)$/, "").trim();
    return w;
  }
  // Builds (or looks up) a short, grammatically-safe example sentence for a word. Prepositions,
  // conjunctions and quantity words come from the hand-curated table above (a generic template
  // risks bad grammar there); nouns/verbs/adjectives/numbers use a template that's valid for
  // essentially any word of that type.
  function exampleFor(word, partKey){
    if(EXAMPLE_OVERRIDES[word]) return EXAMPLE_OVERRIDES[word];
    if(partKey === "nouns") return { fr: "J'aime " + word + ".", ua: null };
    if(partKey === "verbs") return { fr: "Il faut " + word + ".", ua: null };
    if(partKey === "adjectives") return { fr: "Il est très " + adjBaseForm(word) + ".", ua: null };
    if(partKey === "numbers"){
      const singular = (word === "un" || word === "une" || word === "zéro");
      return { fr: "Il y a " + word + (singular ? " livre." : " livres."), ua: null };
    }
    return null;
  }
  // Resolves a (possibly synthetic, per-level or per-theme) category key down to the base
  // part-of-speech key it was built from, so exampleFor() knows which template to use.
  function basePartOfSpeech(catKey){
    const cat = DATA[catKey];
    if(!cat) return catKey;
    if(cat.baseCatKey) return basePartOfSpeech(cat.baseCatKey);
    if(cat.partKey) return cat.partKey;
    return catKey;
  }

  // Builds a shuffled order where priority words come first (still shuffled among

  function priorityOrder(key){
    const items = DATA[key].items;

    const core = idxs.filter(i=>items[i].priority);
    const rest = idxs.filter(i=>!items[i].priority);
    return [...shuffle(core), ...shuffle(rest)];

  function isoFromDate(d){

    const last = abs % 10;
    if(abs > 10 && abs < 20) return "днів";

    if(last >= 2 && last <= 4) return "дні";
    return "днів";
  }

  function recordActivity(percent){

    if(activityDays.indexOf(today) === -1){
      activityDays.push(today);
      activityDays.sort();
      safeSet("fq_activity_days", JSON.stringify(activityDays));
    }
    if(typeof percent === "number" && !isNaN(percent)){

  function computeStreak(){
    if(!activityDays.length) return { current:0, longest:0 };
    const days = [...activityDays].sort();
    let longest = 1, run = 1;
    for(let i=1;i<days.length;i++){
      const diff = Math.round((dateFromISO(days[i]) - dateFromISO(days[i-1])) / 86400000);
      if(diff === 1) run++;
      else if(diff > 1) run = 1;
      longest = Math.max(longest, run);
    }
    const set = new Set(days);
    const today = todayISO();
    let cursor = new Date();
    if(!set.has(today)){
      cursor.setDate(cursor.getDate() - 1);
      if(!set.has(isoFromDate(cursor))) return { current:0, longest };
    }
    let current = 0;
    while(set.has(isoFromDate(cursor))){
      current++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return { current, longest };
  }

  function levenshteinDistance(a, b){
    const m = a.length, n = b.length;
    if(m === 0) return n;
    if(n === 0) return m;
    const dp = new Array(n+1);
    for(let j=0;j<=n;j++) dp[j] = j;
    for(let i=1;i<=m;i++){
      let prev = dp[0];
      dp[0] = i;
      for(let j=1;j<=n;j++){
        const temp = dp[j];
        dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1]===b[j-1] ? 0 : 1));
        prev = temp;

    }
    return dp[n];

  function dictSuggestions(query){
    const q = (query || "").toLowerCase().trim();
    if(q.length < 2) return [];
    const out = [];
    for(const key of CAT_ORDER){
      const cat = DATA[key];
      for(const it of cat.items){
        if(it[0].toLowerCase().includes(q) || it[2].toLowerCase().includes(q)){
          out.push({ item: it, catKey: key, cat: cat });
        }
      }
    }
    out.sort((a,b)=>{
      const aStarts = a.item[0].toLowerCase().startsWith(q) ? 0 : 1;
      const bStarts = b.item[0].toLowerCase().startsWith(q) ? 0 : 1;
      return aStarts - bStarts;
    });
    return out.slice(0,6);
  }

  function wordOfTheDay(){
    const pool = [];
    CAT_ORDER.forEach(key=>{ DATA[key].items.forEach(it=> pool.push({ item: it, catKey: key })); });
    if(!pool.length) return null;
    const seed = todayISO().split("-").join("");
    let hash = 0;
    for(let i=0;i<seed.length;i++){ hash = (hash*31 + seed.charCodeAt(i)) >>> 0; }
    return pool[hash % pool.length];
  }

  function renderConjugRefTable(verb){
    const wrap = document.createElement("div");
    const meta = document.createElement("p"); meta.className="fq-conj-meta";
    const bits = ["<b>" + verb.inf + "</b>"];
    if(verb.ua) bits.push(verb.ua);
    if(verb.group) bits.push(verb.group);
    bits.push("допоміжне " + verb.pc.aux);
    bits.push("дієприкметник " + verb.pc.participle);
    meta.innerHTML = bits.join(" · ");
    wrap.appendChild(meta);
    const pronouns = conjPronounsForDisplay(verb);
    CONJ_REF_TENSES.forEach(t=>{
      const h = document.createElement("h3"); h.className="fq-conj-tense"; h.textContent = t.label;
      wrap.appendChild(h);
      const tableWrap = document.createElement("div"); tableWrap.className="fq-conj-table-wrap";
      const table = document.createElement("table"); table.className="fq-theory-table";
      const thead = document.createElement("tr");
      ["Особа","Форма"].forEach(label=>{ const th=document.createElement("th"); th.textContent=label; thead.appendChild(th); });
      table.appendChild(thead);
      let rows = 0;
      for(let p=0;p<6;p++){
        let form = conjFormRef(verb, t.key, p);
        if(!form) continue;
        if(verb.reflexive){
          const rp = ["me","te","se","nous","vous","se"][p];
          const elide = /^[aeiouhâàéèêëîïôùû]/i.test(form) && (rp === "me" || rp === "te" || rp === "se");
          form = (elide ? rp.charAt(0) + "'" : rp + " ") + form;
        }
        const tr = document.createElement("tr");
        const c1 = document.createElement("td");
        const subj = conjSubjectText(p, form.replace(/^(me|te|se|nous|vous|m'|t'|s')\s*/i,""));
        c1.textContent = verb.impersonal ? "Il" : (p === 0 && subj === "J'" ? "J'" : pronouns[p]);
        const c2 = document.createElement("td");
        const btn = document.createElement("button"); btn.type="button"; btn.className="fq-conj-form";
        const shown = (p === 0 && !verb.reflexive && !verb.impersonal && conjSubjectText(p, form) === "J'") ? "J'" + form : form;
        btn.textContent = shown;
        btn.onclick = ()=> speakFrench((p === 0 && conjSubjectText(p, form) === "J'" ? "J'" : (verb.impersonal ? "Il " : pronouns[p].split(" / ")[0] + " ")) + form);
        c2.appendChild(btn);
        tr.appendChild(c1); tr.appendChild(c2);
        table.appendChild(tr);
        rows++;
      }
      tableWrap.appendChild(table);
      wrap.appendChild(tableWrap);
      if(!rows){
        const empty = document.createElement("p"); empty.className="fq-conj-note"; empty.textContent = "Немає особових форм у цьому часі.";
        wrap.appendChild(empty);
      }
    });
    if(verb.pc.aux === "être"){
      const note = document.createElement("p"); note.className="fq-conj-note";
      note.textContent = "З être дієприкметник узгоджується з підметом: au féminin — " + verb.pc.participle + "e, au pluriel — " + conjPluralParticiple(verb.pc.participle) + ".";
      wrap.appendChild(note);
    }
    if(verb.generated){
      const note = document.createElement("p"); note.className="fq-conj-note";
      note.textContent = "Форми зібрано за правилами групи. Якщо дієслово дуже неправильне, звір з граматичним словником.";
      wrap.appendChild(note);
    }
    return wrap;
  }
  function renderConjugRefBody(){
    const wrap = document.getElementById("fqConjRefBody");
    if(!wrap) return;
    wrap.innerHTML = "";
    const q = (state.conjRefQuery || "").trim();
    const qLow = q.toLowerCase();
    const hits = searchConjCatalog(q);
    const exactInf = hits.find(h => h.inf.toLowerCase() === qLow);
    const exactForm = q.length >= 3 ? hits.find(h => h.forms.some(f => f === qLow || f.replace(/ /g,"") === qLow.replace(/ /g,""))) : null;
    const typed = (!exactInf && q.length >= 2) ? conjugateAny(q, "") : null;
    let tableVerb = null;
    let tableInf = null;
    if(state.conjRefInf){
      const hit = getConjCatalog().find(v => v.inf === state.conjRefInf);
      tableVerb = hit ? hit.conj : conjugateAny(state.conjRefInf, "");
      tableInf = state.conjRefInf;
    } else if(exactInf){
      tableVerb = exactInf.conj;
      tableInf = exactInf.inf;
    } else if(exactForm){
      tableVerb = exactForm.conj;
      tableInf = exactForm.inf;
    } else if(typed){
      tableVerb = typed;
      tableInf = typed.inf;
    }
    if(!q && !state.conjRefInf){
      const hint = document.createElement("p"); hint.className="fq-conj-meta";
      hint.textContent = "Почни вводити інфінітив, український переклад або вже відмінену форму. У таблиці: présent, imparfait, futur, conditionnel, passé composé, plus-que-parfait і subjonctif.";
      wrap.appendChild(hint);
    }
    if(tableVerb && (state.conjRefInf || exactInf || exactForm || typed)){
      wrap.appendChild(renderConjugRefTable(tableVerb));
    }
    const listSource = hits.filter(h => h.inf !== tableInf);
    if(!q && !state.conjRefInf){
      const count = document.createElement("p"); count.className="fq-dict-count";

    if(!SPEECH_RECOGNITION_SUPPORTED){
      const kicker = document.createElement("p"); kicker.className="fq-kicker"; kicker.textContent="Розпізнавання мовлення";
      const title = document.createElement("h2"); title.className="fq-title"; title.textContent="🎙️ Вимова";
      root.appendChild(kicker); root.appendChild(title);
      const msg = document.createElement("p"); msg.className="fq-drawer-note";
      msg.textContent = "Цей браузер не підтримує розпізнавання мовлення (Web Speech API). Спробуй відкрити застосунок у Chrome на комп'ютері або Android — там ця функція працює найкраще.";
      root.appendChild(msg);
      return;
    }
    if(!state.speechCurrent) return;

    const barWrap = document.createElement("div"); barWrap.className="fq-progressbar";
    const barFill = document.createElement("div"); barFill.className="fq-progressbar-fill";
    barFill.style.width = Math.round(state.speechIndex/state.speechPool.length*100) + "%";
    barWrap.appendChild(barFill);
    root.appendChild(barWrap);

    const label = document.createElement("p"); label.className="fq-prompt-label";
    label.textContent = "Прочитай вголос:";
    root.appendChild(label);

    const prompt = document.createElement("p"); prompt.className="fq-prompt";
    prompt.textContent = state.speechCurrent.fr;
    root.appendChild(prompt);

    const subLabel = document.createElement("p"); subLabel.className="fq-history-note";
    subLabel.textContent = state.speechCurrent.ua + " · " + state.speechCurrent.catLabel;
    root.appendChild(subLabel);

    const micBox = document.createElement("div"); micBox.className="fq-audio-box";
    const micBtn = document.createElement("button");
    micBtn.type = "button";
    micBtn.className = "fq-audio-play" + (state.speechListening ? " fq-audio-play-listening" : "");
    micBtn.textContent = state.speechListening ? "🔴" : "🎙️";
    micBtn.title = state.speechListening ? "Слухаю..." : "Натисни і скажи слово вголос";
    micBtn.disabled = state.speechAnswered || state.speechListening;
    micBtn.onclick = speechStartListening;
    micBox.appendChild(micBtn);
    root.appendChild(micBox);

    if(state.speechListening){
      const listeningNote = document.createElement("p"); listeningNote.className="fq-history-note";
      listeningNote.style.textAlign = "center";
      listeningNote.textContent = "Слухаю... кажи чітко у мікрофон.";
      root.appendChild(listeningNote);
    }

    if(state.speechError){
      const errNote = document.createElement("p"); errNote.className="fq-hint-wrong";
      errNote.textContent = speechErrorMessage(state.speechError);
      root.appendChild(errNote);
    }

    if(state.speechAnswered){
      const resultBox = document.createElement("div"); resultBox.className="fq-hint";
      const verdict = document.createElement("p");
      verdict.className = state.speechCorrect ? "fq-hint-correct" : "fq-hint-wrong";
      verdict.textContent = state.speechCorrect ? "✅ Розпізнано правильно!" : "❌ Почуто інакше";
      resultBox.appendChild(verdict);
      const heard = document.createElement("p"); heard.className="fq-history-note";
      heard.innerHTML = "Розпізнано: «<b>" + (state.speechRecognized || "—") + "</b>»";
      resultBox.appendChild(heard);
      const speakBtn = document.createElement("button");
      speakBtn.type = "button";
      speakBtn.className = "fq-speak";
      speakBtn.textContent = "🔊 Почути правильну вимову";
      speakBtn.onclick = ()=> speakFrench(state.speechCurrent.fr);
      resultBox.appendChild(speakBtn);
      root.appendChild(resultBox);

      const retryBtn = document.createElement("button");
      retryBtn.type = "button";
      retryBtn.className = "fq-btn-secondary";
      retryBtn.style.marginTop = "10px";
      retryBtn.textContent = "🔁 Спробувати ще раз";
      retryBtn.onclick = speechRetry;
      root.appendChild(retryBtn);
    }

    const nextbar = document.createElement("div"); nextbar.className="fq-nextbar";
    const nextBtn = document.createElement("button"); nextBtn.className="fq-next"; nextBtn.textContent="Далі →";
    nextBtn.disabled = !state.speechAnswered;
    nextBtn.onclick = handleSpeechNext;
    nextbar.appendChild(nextBtn);
    root.appendChild(nextbar);
  }
  function renderSpeechSummary(){
    const kicker = document.createElement("p"); kicker.className="fq-kicker"; kicker.textContent = "🎙️ Вимова";
    const title = document.createElement("h2"); title.className="fq-title"; title.textContent = "Порція завершена";
    root.appendChild(kicker); root.appendChild(title);
    const total = state.speechPool.length;
    const scoreEl = document.createElement("div"); scoreEl.className="fq-summary-score"; scoreEl.textContent = state.speechScore + " / " + total;
    root.appendChild(scoreEl);
    if(state.speechMissed.length){
      const mt = document.createElement("div"); mt.className="fq-missed-title"; mt.textContent="Варто повторити вимову:";
      root.appendChild(mt);
      state.speechMissed.forEach(it=>{
        const row = document.createElement("div"); row.className="fq-missed-item";
        const fr = document.createElement("span"); fr.className="fq-missed-fr"; fr.textContent = it.fr;
        const ua = document.createElement("span"); ua.className="fq-missed-ua"; ua.textContent = it.ua;
        row.appendChild(fr); row.appendChild(ua);
        root.appendChild(row);
      });
    }
    const btnrow = document.createElement("div"); btnrow.className="fq-btnrow";
    const again = document.createElement("button"); again.className="fq-btn-primary"; again.textContent="Ще одна порція";
    again.onclick = startSpeechPractice;
    btnrow.appendChild(again);
    const toPicker = document.createElement("button"); toPicker.className="fq-btn-secondary"; toPicker.textContent="Назад до розділів";
    toPicker.onclick = ()=>{ state.view="picker"; render(); };
    btnrow.appendChild(toPicker);
    root.appendChild(btnrow);
  }
  render();
})();</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
</body>
</html>
